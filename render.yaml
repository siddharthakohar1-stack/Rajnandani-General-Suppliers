services:
  - type: web
    name: rajnandani-scratch-win
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STAFF_PASSCODE
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
# Free plan has no persistent disk: data/store.json resets on every restart/redeploy.
# To keep dealer+coupon data permanently, upgrade to the Starter plan and add:
#     disk:
#       name: scratch-win-data
#       mountPath: /var/data
#       sizeGB: 1
#   envVars:
#     - key: DATA_DIR
#       value: /var/data
