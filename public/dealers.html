<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rajnandani Suppliers — Dealer Data</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { primary: '#740010', 'primary-container': '#9b111e', secondary: '#7b5900' },
  fontFamily: { display: ['Outfit','sans-serif'], body: ['Plus Jakarta Sans','sans-serif'] }
}}};
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;}
  table{border-collapse:collapse;}
  th,td{white-space:nowrap;}
</style>
</head>
<body class="bg-[#fff8f6] font-body text-[#1f1b1a] min-h-screen flex flex-col items-center px-4 py-6">

<div class="w-full max-w-5xl flex items-center gap-2 mb-6">
  <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center">
    <span class="material-symbols-outlined text-white text-[20px]">groups</span>
  </div>
  <div class="flex flex-col leading-tight">
    <span class="font-display font-bold text-primary text-sm">Rajnandani Suppliers</span>
    <span class="text-[11px] text-[#5a403f]">Dealer Data — gifts &amp; offers planning</span>
  </div>
</div>

<div id="gate" class="w-full max-w-sm bg-white rounded-2xl shadow-sm p-5 flex flex-col gap-3">
  <label class="text-sm font-semibold">Admin Passcode</label>
  <input id="passcode" type="password" placeholder="Admin passcode"
    class="w-full rounded-xl border border-black/10 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary"/>
  <button id="loadBtn" class="py-3 rounded-xl bg-primary text-white font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition-transform">
    <span class="material-symbols-outlined text-[18px]">visibility</span> View Dealers
  </button>
  <p id="gateError" class="text-sm text-red-600 hidden"></p>
</div>

<div id="dataArea" class="hidden w-full max-w-5xl flex flex-col gap-3">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <span id="summary" class="text-sm text-[#5a403f]"></span>
    <div class="flex gap-2">
      <button id="refreshBtn" class="px-3 py-2 rounded-xl bg-white shadow-sm text-sm font-semibold flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px]">refresh</span> Refresh
      </button>
      <a id="exportLink" class="px-3 py-2 rounded-xl bg-primary text-white shadow-sm text-sm font-semibold flex items-center gap-1" href="#">
        <span class="material-symbols-outlined text-[18px]">download</span> Download CSV
      </a>
    </div>
  </div>
  <div class="w-full overflow-x-auto bg-white rounded-2xl shadow-sm">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-[#f6ecea] text-left text-[#5a403f]">
          <th class="px-3 py-2">Shop Name</th>
          <th class="px-3 py-2">Dealer Name</th>
          <th class="px-3 py-2">Mobile</th>
          <th class="px-3 py-2">Participated</th>
          <th class="px-3 py-2">Result</th>
          <th class="px-3 py-2">Coupon Code</th>
          <th class="px-3 py-2">Coupon Status</th>
        </tr>
      </thead>
      <tbody id="dealerRows"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  const gate = document.getElementById('gate');
  const dataArea = document.getElementById('dataArea');
  const passcode = document.getElementById('passcode');
  const gateError = document.getElementById('gateError');
  const dealerRows = document.getElementById('dealerRows');
  const summary = document.getElementById('summary');
  const exportLink = document.getElementById('exportLink');

  function statusBadge(status) {
    const colors = {
      issued: 'bg-amber-100 text-amber-800',
      redeemed: 'bg-green-100 text-green-800',
      cancelled: 'bg-gray-200 text-gray-700'
    };
    if (!status) return '<span class="text-gray-400">—</span>';
    return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${colors[status] || ''}">${status}</span>`;
  }

  async function loadDealers() {
    const res = await fetch('/api/dealers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode: passcode.value })
    });
    const data = await res.json();

    if (!res.ok) {
      gateError.textContent = data.error || 'Could not load dealer data.';
      gateError.classList.remove('hidden');
      return;
    }

    gate.classList.add('hidden');
    dataArea.classList.remove('hidden');
    exportLink.href = '/api/dealers/export?passcode=' + encodeURIComponent(passcode.value);

    const won = data.dealers.filter(d => d.won).length;
    const redeemed = data.dealers.filter(d => d.couponStatus === 'redeemed').length;
    summary.textContent = `${data.dealers.length} dealers participated · ${won} won a reward · ${redeemed} redeemed so far`;

    dealerRows.innerHTML = data.dealers.map(d => `
      <tr class="border-t border-black/5">
        <td class="px-3 py-2 font-medium">${d.shopName}</td>
        <td class="px-3 py-2">${d.dealerName}</td>
        <td class="px-3 py-2 font-mono">${d.mobile}</td>
        <td class="px-3 py-2">${new Date(d.participatedAt).toLocaleString()}</td>
        <td class="px-3 py-2">${d.won ? d.rewardLabel : '<span class="text-gray-400">No prize</span>'}</td>
        <td class="px-3 py-2 font-mono">${d.couponCode || '—'}</td>
        <td class="px-3 py-2">${statusBadge(d.couponStatus)}</td>
      </tr>
    `).join('');
  }

  document.getElementById('loadBtn').addEventListener('click', () => {
    gateError.classList.add('hidden');
    loadDealers();
  });
  document.getElementById('refreshBtn').addEventListener('click', loadDealers);
})();
</script>
</body>
</html>
